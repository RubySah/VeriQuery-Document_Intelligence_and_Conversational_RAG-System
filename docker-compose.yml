
services:

  postgres:
    image: postgres:16
    container_name: palmind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: palmind_local_123
      POSTGRES_DB: palmind_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: palmind-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: palmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
